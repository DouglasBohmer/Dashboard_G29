[platformio]
default_envs = diagnostico_tft

[env:diagnostico_tft]
platform = platformio/espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    adafruit/Adafruit ILI9341@1.6.2
    adafruit/Adafruit GFX Library@1.12.1
